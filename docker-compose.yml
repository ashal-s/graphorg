services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphorg
      POSTGRES_PASSWORD: graphorg
      POSTGRES_DB: graphorg
    ports:
      # Host port 5433, not 5432: many dev machines already have a local
      # Postgres bound to 5432 (Homebrew, Postgres.app, another project's
      # Docker stack, ...), and this avoids colliding with it.
      - "5433:5432"
    volumes:
      - graphorg-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - graphorg-redis:/data

  # OpenTelemetry Collector (WEB-223). Receives OTLP from apps/web +
  # ai-worker; forwards traces → Tempo, metrics → Prometheus scrape.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo

  # Tempo — trace store (WEB-224). OTLP only on the Docker network.
  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - graphorg-tempo:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP API / query

  # Prometheus — scrapes collector :8889 (WEB-224).
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - graphorg-prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  # Grafana — dashboards on Tempo + Prometheus (WEB-224). Port 3001 so it
  # does not collide with Next.js on 3000.
  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - graphorg-grafana:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - tempo
      - prometheus

  # Jenkins OSS (WEB-222). Same checks as GitHub Actions, run locally.
  # UI on http://localhost:8080. Tools live in the image — the Docker socket
  # is not mounted (see docs/tooling.md, Docker Desktop on Mac).
  jenkins:
    build:
      context: ./infra/jenkins
    image: graphorg-jenkins:local
    restart: unless-stopped
    # Cookies are per host, not per port, so the browser sends every
    # localhost cookie to :8080. Jetty's default 8KB header limit then
    # returns 431. 256KB covers the other local apps on this machine.
    environment:
      JENKINS_OPTS: "--requestHeaderSize=262144"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - graphorg-jenkins:/var/jenkins_home

volumes:
  graphorg-postgres:
  graphorg-redis:
  graphorg-tempo:
  graphorg-prometheus:
  graphorg-grafana:
  graphorg-jenkins:
