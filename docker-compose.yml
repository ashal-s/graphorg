services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphorg
      POSTGRES_PASSWORD: graphorg
      POSTGRES_DB: graphorg
    ports:
      - "5432:5432"
    volumes:
      - graphorg-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - graphorg-redis:/data

volumes:
  graphorg-postgres:
  graphorg-redis:
