services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphorg
      POSTGRES_PASSWORD: graphorg
      POSTGRES_DB: graphorg
    ports:
      # Host port 5433, not 5432: many dev machines already have a local
      # Postgres bound to 5432 (Homebrew, Postgres.app, another project's
      # Docker stack, ...), and this avoids colliding with it.
      - "5433:5432"
    volumes:
      - graphorg-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - graphorg-redis:/data

  # OpenTelemetry Collector (WEB-223). Receives OTLP HTTP/gRPC from apps/web
  # and services/ai-worker; logs to stdout until Grafana/Tempo (WEB-224).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

volumes:
  graphorg-postgres:
  graphorg-redis:
