# Local OpenTelemetry Collector for GraphOrg (WEB-223).
# Receives OTLP from apps/web + services/ai-worker and logs to stdout.
# WEB-224 will add Tempo / Prometheus exporters and Grafana datasources.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
