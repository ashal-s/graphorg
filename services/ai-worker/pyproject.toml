[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-worker"
version = "0.0.0"
description = "GraphOrg's Python worker — document processing, embeddings, retrieval helpers and AI evaluation. Invoked internally by apps/web; never exposed to the browser."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_worker"]
